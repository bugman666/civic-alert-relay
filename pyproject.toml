[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-alert-relay"
version = "0.1.0"
description = "Ingest open hazard feeds and fan them out over WebPush, Telegram, Webhook, and WebSocket."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "bugman666", email = "2643819278@qq.com" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
civic-alert-relay = "civic_alert_relay.__main__:main"

[project.urls]
Homepage = "https://github.com/bugman666/civic-alert-relay"
Issues = "https://github.com/bugman666/civic-alert-relay/issues"

[tool.setuptools.packages.find]
include = ["civic_alert_relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
